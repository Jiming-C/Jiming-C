# Redraws the README dash (scripts/draw.mjs) every 6 hours and publishes the two SVGs to the `output` branch,
# where the README reads them.
name: cluster
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/cluster.yml"]
permissions:
  contents: write
  actions: write
jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Draw
        run: node scripts/draw.mjs "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to the output branch
        run: |
          cd dist
          git init -q
          git checkout -q -b output
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Redraw the dash"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub switches scheduled workflows off after 60 days without repository activity; re-enabling this one
      # through the API on every run keeps the redraw going without any commits to main
      - name: Keep the schedule alive
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/cluster.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
